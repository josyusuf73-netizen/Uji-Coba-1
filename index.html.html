<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Romantic Presentation Builder</title>
<style>
/* ========================================================================
   ROMANTIC PRESENTATION BUILDER — EDITOR SHELL STYLES
   ======================================================================== */
:root{
  --editor-bg:#141019;
  --panel-bg:#1c1626;
  --panel-bg-2:#231b31;
  --line:#332948;
  --text:#f1e9f7;
  --text-dim:#a897b8;
  --accent:#ff6f9c;
  --accent-2:#ffb0c8;
  --radius:14px;
  font-family:'Segoe UI',Tahoma,Verdana,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--editor-bg);color:var(--text);overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#3a2e4f;border-radius:8px;}

/* ---------- App shell ---------- */
#app{display:flex;flex-direction:column;height:100vh;}
#topbar{
  display:flex;align-items:center;gap:12px;padding:10px 18px;
  background:linear-gradient(90deg,#1c1626,#241a2e);
  border-bottom:1px solid var(--line); flex-shrink:0;
}
#topbar .brand{font-weight:700;font-size:15px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;}
#topbar .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
#topbar .spacer{flex:1;}
.topbtn{
  background:var(--panel-bg-2);border:1px solid var(--line);color:var(--text);
  padding:8px 14px;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:6px;transition:.18s;
}
.topbtn:hover{background:#2c2138;border-color:var(--accent);}
.topbtn.primary{background:linear-gradient(135deg,var(--accent),#b45b8f);border:none;font-weight:600;}
.topbtn.primary:hover{filter:brightness(1.1);}
.slidecount{font-size:12px;color:var(--text-dim);}

#main{display:flex;flex:1;min-height:0;}

/* ---------- Left rail ---------- */
#rail{
  width:84px;flex-shrink:0;background:var(--panel-bg);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:stretch;padding:10px 6px;gap:4px;overflow-y:auto;
}
.railbtn{
  background:transparent;border:none;color:var(--text-dim);border-radius:10px;padding:10px 4px;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;transition:.15s;
}
.railbtn .ic{font-size:19px;}
.railbtn:hover{background:var(--panel-bg-2);color:var(--text);}
.railbtn.active{background:linear-gradient(135deg,rgba(255,111,156,.22),rgba(255,111,156,.06));color:var(--accent-2);}

/* ---------- Property panel ---------- */
#panel{
  width:300px;flex-shrink:0;background:var(--panel-bg);border-right:1px solid var(--line);
  overflow-y:auto;padding:16px;
}
#panel h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent-2);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;}
.field input[type=text],.field textarea,.field select{
  width:100%;background:var(--panel-bg-2);border:1px solid var(--line);color:var(--text);
  padding:8px 10px;border-radius:8px;font-size:13px;
}
.field textarea{resize:vertical;min-height:60px;}
.field input[type=range]{width:100%;}
.field .row{display:flex;gap:8px;}
.field .row>*{flex:1;}
.swatchrow{display:flex;gap:6px;flex-wrap:wrap;}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.swatch.active{border-color:#fff;}
.colorinput{width:40px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;}
.uploadbox{
  border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;font-size:12px;
  color:var(--text-dim);cursor:pointer;transition:.15s;position:relative;overflow:hidden;
}
.uploadbox:hover{border-color:var(--accent);color:var(--text);}
.uploadbox input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.uploadbox img{max-width:100%;max-height:70px;border-radius:6px;margin-top:6px;}
.photogrid{display:flex;gap:8px;}
.photogrid .uploadbox{flex:1;padding:8px;}
.themegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.themecard{
  border-radius:10px;padding:10px;border:2px solid transparent;cursor:pointer;font-size:11.5px;font-weight:600;
  text-align:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);
}
.themecard.active{border-color:#fff;}
.checkrow{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:6px;color:var(--text-dim);}
.hint{font-size:11px;color:var(--text-dim);line-height:1.5;margin-top:4px;}
.small-btn{
  background:var(--panel-bg-2);border:1px solid var(--line);color:var(--text);border-radius:8px;
  padding:7px 10px;font-size:12px;width:100%;text-align:center;
}
.small-btn:hover{border-color:var(--accent);}
.timeline-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;margin-bottom:6px;
  border:1px solid var(--line);cursor:pointer;transition:.15s;
}
.timeline-item:hover{border-color:var(--accent);}
.timeline-item.active{background:rgba(255,111,156,.14);border-color:var(--accent);}
.timeline-item .num{
  width:22px;height:22px;border-radius:50%;background:var(--panel-bg-2);display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;
}
.timeline-item .lbl{font-size:12.5px;}
.timeline-item .sub{font-size:10px;color:var(--text-dim);}

/* ---------- Canvas area ---------- */
#canvasWrap{flex:1;display:flex;align-items:center;justify-content:center;background:#0d0a12;position:relative;padding:26px;min-width:0;}
#canvasFrame{
  width:min(920px,100%);aspect-ratio:16/9;position:relative;border-radius:18px;overflow:hidden;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.05);
}
#canvasHint{position:absolute;bottom:-30px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--text-dim);}

/* ---------- Overlays ---------- */
#viewerOverlay{position:fixed;inset:0;background:#000;z-index:999;display:none;}
#viewerOverlay.show{display:block;}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:900;display:none;align-items:center;justify-content:center;}
.modal-backdrop.show{display:flex;}
.modal{background:var(--panel-bg);border:1px solid var(--line);border-radius:14px;padding:22px;width:340px;}
.modal h3{margin:0 0 12px;font-size:15px;}
.modal .actions{display:flex;gap:8px;margin-top:16px;}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2c2138;color:#fff;
  padding:10px 18px;border-radius:10px;font-size:13px;z-index:1000;opacity:0;transition:.25s;pointer-events:none;
  border:1px solid var(--accent);
}
.toast.show{opacity:1;}

@media(max-width:900px){
  #panel{width:250px;}
  #rail{width:64px;}
  .railbtn .ic{font-size:17px;}
  .railbtn{font-size:9px;}
}
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="brand"><span class="dot"></span> Romantic Presentation Builder</div>
    <span class="slidecount" id="slideCountLbl"></span>
    <div class="spacer"></div>
    <button class="topbtn" id="btnPreview">▶ Preview</button>
    <button class="topbtn" id="btnSave">💾 Save</button>
    <button class="topbtn" id="btnLoad">📂 Load</button>
    <button class="topbtn primary" id="btnExport">⇩ Export HTML</button>
  </div>

  <div id="main">
    <div id="rail">
      <button class="railbtn active" data-tab="slides"><span class="ic">🎬</span>Slides</button>
      <button class="railbtn" data-tab="theme"><span class="ic">🎨</span>Theme</button>
      <button class="railbtn" data-tab="music"><span class="ic">🎵</span>Music</button>
      <button class="railbtn" data-tab="settings"><span class="ic">⚙️</span>Settings</button>
    </div>

    <div id="panel"></div>

    <div id="canvasWrap">
      <div id="canvasFrame"></div>
      <div id="canvasHint">Klik teks untuk mengedit langsung • Gunakan panel kiri untuk pengaturan lainnya</div>
    </div>
  </div>
</div>

<div id="viewerOverlay"></div>

<div class="modal-backdrop" id="loadModal">
  <div class="modal">
    <h3>Buka Project Tersimpan</h3>
    <div id="loadList" style="display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto;"></div>
    <div class="actions">
      <button class="small-btn" id="loadCancel">Batal</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ========================================================================
   SECTION 1 — SHARED CONSTANTS, THEMES, ANIMATION LIBRARY
   (These are written as standalone globals so they can be re-serialized
    verbatim into the exported single-file Viewer.)
   ======================================================================== */

const PLACEHOLDER_IMG = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="#2a2035"/><text x="50%" y="50%" fill="#8a7a99" font-size="20" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">Foto</text></svg>'
);

const THEMES = {
  classicPink:   {label:"Classic Pink",     primary:"#e85d8a", secondary:"#ffc2d6", bg:"#fff5f8", text:"#4a2436", font:"Georgia, 'Times New Roman', serif"},
  romanticSakura:{label:"Romantic Sakura",  primary:"#f7a8c4", secondary:"#ffe1ec", bg:"#fff0f5", text:"#5b3145", font:"Georgia, serif"},
  cuteCat:       {label:"Cute Cat",         primary:"#ff9457", secondary:"#ffd9b0", bg:"#fff8f0", text:"#4a3223", font:"'Segoe UI', sans-serif"},
  bearLove:      {label:"Bear Love",        primary:"#c98a5e", secondary:"#f0d3b3", bg:"#fbf3e7", text:"#3f2c1d", font:"'Segoe UI', sans-serif"},
  darkRomantic:  {label:"Dark Romantic",    primary:"#ff6b9d", secondary:"#7a3b5e", bg:"#1a0f16", text:"#f3d9e5", font:"Georgia, serif"},
  minimalWhite:  {label:"Minimal White",    primary:"#b98ea6", secondary:"#e8e8e8", bg:"#ffffff", text:"#2c2c2c", font:"'Segoe UI', sans-serif"},
  galaxyNight:   {label:"Galaxy Night",     primary:"#a78bfa", secondary:"#38bdf8", bg:"#0b0620", text:"#e6e1ff", font:"Georgia, serif"}
};

const ANIMATIONS = ["fadeIn","zoomIn","scaleIn","slideUp","slideDown","slideLeft","slideRight","blurReveal","popIn","rotateIn","flipIn","bounceIn","typing","softReveal","heartBeat","glow"];
const GALLERY_ANIMATIONS = ["fadeIn","zoomIn","rotateIn","flipIn","blurReveal","slideLeft","scaleIn"];
const DECORATIONS = ["none","sakura","stars","love","glow"];
const CLOSING_DECORATIONS = ["confetti","heart","flower","sparkle","particle"];

const ANIM_CSS = `
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes zoomIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:translateX(0)}}
@keyframes blurReveal{from{opacity:0;filter:blur(14px)}to{opacity:1;filter:blur(0)}}
@keyframes popIn{0%{opacity:0;transform:scale(.35)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes rotateIn{from{opacity:0;transform:rotate(-14deg) scale(.8)}to{opacity:1;transform:rotate(0) scale(1)}}
@keyframes flipIn{from{opacity:0;transform:perspective(600px) rotateY(85deg)}to{opacity:1;transform:perspective(600px) rotateY(0)}}
@keyframes bounceIn{0%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.08)}75%{transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
@keyframes softReveal{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes heartBeatIn{0%{opacity:0;transform:scale(.5)}40%{opacity:1;transform:scale(1.15)}60%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes glowIn{0%{opacity:0;filter:brightness(2) blur(6px)}100%{opacity:1;filter:brightness(1) blur(0)}}
@keyframes typingW{from{width:0}to{width:100%}}
@keyframes fallDown{0%{transform:translateY(-10vh) rotate(0deg);opacity:0}10%{opacity:1}100%{transform:translateY(110vh) rotate(360deg);opacity:.9}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(-110vh);opacity:0}}
@keyframes discSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes eqBar{0%,100%{height:4px}50%{height:14px}}
`;

function animClass(name){ return "anim-"+(name||"fadeIn"); }

/* ========================================================================
   SECTION 2 — SHARED VIEWER CSS (used both for in-editor Preview overlay
   and embedded verbatim into the exported standalone file)
   ======================================================================== */
const VIEWER_CSS = `
*{box-sizing:border-box;}
.vwRoot{position:absolute;inset:0;overflow:hidden;font-family:var(--vw-font, Georgia, serif);background:var(--vw-bg,#fff0f5);color:var(--vw-text,#4a2436);}
.vw-stage{position:absolute;inset:0;}
.vw-slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background-size:cover;background-position:center;}
.vw-slide video.bgvideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
.vw-slide .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35));z-index:1;}
.deco-layer{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden;}
.deco-item{position:absolute;font-size:22px;will-change:transform;line-height:1;}
.deco-item.star{animation:twinkle 2.2s ease-in-out infinite;}
.deco-item.floaty{bottom:-10%;animation:floatUp linear infinite;}

.opening-inner,.text-inner{position:relative;z-index:3;text-align:center;padding:6% 8%;max-width:80%;}
.opening-inner h1{margin:0 0 14px;font-weight:700;line-height:1.15;}
.opening-inner .subtitle{margin:0;font-size:20px;opacity:.9;font-style:italic;}
.text-inner{max-width:70%;}
.text-inner.layout-left{text-align:left;margin-right:auto;}
.text-inner.layout-right{text-align:right;margin-left:auto;}
.text-inner h2{font-size:34px;margin:0 0 12px;}
.text-inner p{font-size:17px;line-height:1.7;white-space:pre-wrap;}

.gallery-inner{position:relative;width:100%;height:100%;}
.gallery-photo{position:absolute;inset:6%;width:88%;height:88%;object-fit:cover;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.35);}

.poster-inner{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;}
.poster-photo{width:34%;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.35);position:relative;
  transform:scale(2.1) translateY(28%); transition:transform 1.1s cubic-bezier(.22,.9,.32,1);}
.poster-photo.settled{transform:scale(1) translateY(-18%);}
.poster-text{font-size:24px;text-align:center;max-width:70%;font-weight:600;}

.closing-inner{position:relative;z-index:3;text-align:center;max-width:78%;display:flex;flex-direction:column;align-items:center;gap:10px;}
.closing-photo{width:180px;height:180px;object-fit:cover;border-radius:50%;box-shadow:0 12px 30px rgba(0,0,0,.35);margin-bottom:6px;}
.closing-video{width:60%;border-radius:14px;margin-bottom:6px;}
.closing-inner h2{margin:4px 0;font-size:30px;}
.closing-inner p{font-size:16px;line-height:1.7;margin:0;}
.closing-inner blockquote{font-style:italic;font-size:16px;opacity:.85;margin:6px 0;}
.finish-indicator{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:10px;transition:opacity .6s;}
.repeat-btn{background:var(--vw-primary,#e85d8a);border:none;color:#fff;padding:10px 26px;border-radius:30px;font-size:14px;font-weight:600;box-shadow:0 8px 20px -6px var(--vw-primary,#e85d8a);}

.anim-fadeIn{animation:fadeIn 1s ease both;}
.anim-zoomIn{animation:zoomIn 1s cubic-bezier(.2,.8,.3,1) both;}
.anim-scaleIn{animation:scaleIn .9s ease both;}
.anim-slideUp{animation:slideUp .9s cubic-bezier(.2,.8,.3,1) both;}
.anim-slideDown{animation:slideDown .9s cubic-bezier(.2,.8,.3,1) both;}
.anim-slideLeft{animation:slideLeft .9s cubic-bezier(.2,.8,.3,1) both;}
.anim-slideRight{animation:slideRight .9s cubic-bezier(.2,.8,.3,1) both;}
.anim-blurReveal{animation:blurReveal 1.1s ease both;}
.anim-popIn{animation:popIn .8s cubic-bezier(.3,1.4,.5,1) both;}
.anim-rotateIn{animation:rotateIn .9s ease both;}
.anim-flipIn{animation:flipIn 1s ease both;}
.anim-bounceIn{animation:bounceIn 1s cubic-bezier(.3,1.4,.5,1) both;}
.anim-softReveal{animation:softReveal 1s ease both;}
.anim-heartBeat{animation:heartBeatIn 1s ease both;}

.anim-typing h1,.anim-typing h2{display:inline-block;overflow:hidden;white-space:nowrap;border-right:3px solid currentColor;animation:typingW 1.4s steps(20,end) both;}

.vw-progress{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:9px;z-index:20;}
.vw-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.5);transition:.3s;}
.vw-dot.active{background:var(--vw-primary,#e85d8a);border-color:var(--vw-primary,#e85d8a);box-shadow:0 0 8px var(--vw-primary,#e85d8a);}

.vw-next{
  position:absolute;bottom:52px;left:50%;transform:translateX(-50%);
  background:var(--vw-primary,#e85d8a);color:#fff;border:none;padding:11px 30px;border-radius:30px;
  font-size:14px;font-weight:600;letter-spacing:.3px;z-index:20;box-shadow:0 10px 24px -8px var(--vw-primary,#e85d8a);
  opacity:0;animation:fadeIn .5s ease both;
}
.vw-next:hover{filter:brightness(1.08);}

.vw-player{
  position:absolute;left:16px;bottom:16px;z-index:20;display:none;align-items:center;gap:10px;
  background:rgba(20,15,25,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);
  border-radius:30px;padding:7px 14px 7px 7px;
}
.vw-disc{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at center,#333 0 30%,#111 31% 100%);animation:discSpin 4s linear infinite;position:relative;}
.vw-disc::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--vw-primary,#e85d8a);}
.vw-track-name{font-size:11.5px;color:#fff;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vw-eq{display:flex;align-items:flex-end;gap:2px;height:14px;margin-top:2px;}
.vw-eq span{width:3px;background:var(--vw-primary,#e85d8a);animation:eqBar .8s ease-in-out infinite;border-radius:2px;}
.vw-eq span:nth-child(2){animation-delay:.15s;}
.vw-eq span:nth-child(3){animation-delay:.3s;}
.vw-eq span:nth-child(4){animation-delay:.45s;}

.vw-exit{position:absolute;top:14px;right:14px;z-index:30;background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.3);padding:7px 12px;border-radius:20px;font-size:12px;}

@media(max-width:640px){
  .opening-inner h1{font-size:34px !important;}
  .text-inner h2{font-size:24px;}
  .text-inner p{font-size:14px;}
  .poster-photo{width:52%;}
  .closing-photo{width:130px;height:130px;}
  .vw-player{transform:scale(.85);left:6px;bottom:6px;}
}
`;

/* ========================================================================
   SECTION 3 — PURE RENDER / RUNTIME FUNCTIONS
   (standalone, no outer closures besides the globals above — safe to
    re-serialize into the exported viewer file)
   ======================================================================== */

function escapeHtml(str){
  return (str||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function themeVars(data){
  const t = THEMES[data.theme] || THEMES.classicPink;
  const c = Object.assign({}, t, data.customColors||{});
  return c;
}

function applyTheme(root, data){
  const c = themeVars(data);
  root.style.setProperty("--vw-primary", c.primary);
  root.style.setProperty("--vw-secondary", c.secondary);
  root.style.setProperty("--vw-bg", c.bg);
  root.style.setProperty("--vw-text", c.text);
  root.style.setProperty("--vw-font", c.font);
}

function applyBackground(el, bg){
  el.querySelectorAll(":scope > video.bgvideo, :scope > .veil").forEach(n=>n.remove());
  if(!bg || !bg.type || !bg.value){
    // No background configured for this slide: fall through to the active theme's
    // background color (set as --vw-bg on the root) so switching themes restyles it too.
    el.style.background = "var(--vw-bg)";
    return;
  }
  if(bg.type === "video"){
    const v = document.createElement("video");
    v.className = "bgvideo"; v.src = bg.value; v.autoplay = true; v.muted = true; v.loop = true; v.playsInline = true;
    el.insertBefore(v, el.firstChild);
    const veil = document.createElement("div"); veil.className="veil";
    el.insertBefore(veil, el.firstChild.nextSibling);
    el.style.background = "#000";
  } else if(bg.type === "image"){
    el.style.background = `url('${bg.value}') center/cover no-repeat`;
    const veil = document.createElement("div"); veil.className="veil";
    el.insertBefore(veil, el.firstChild);
  } else if(bg.type === "gradient"){
    el.style.background = bg.value;
  } else {
    el.style.background = bg.value;
  }
}

function spawnDecorations(layerEl, kinds){
  if(!layerEl || !kinds) return;
  const list = Array.isArray(kinds) ? kinds : String(kinds).split(",").map(s=>s.trim()).filter(Boolean);
  const map = {sakura:"🌸", stars:"✨", love:"💕", glow:"✨", confetti:"🎊", heart:"💖", flower:"🌸", sparkle:"✨", particle:"•"};
  list.forEach(kind=>{
    if(kind === "none" || !map[kind]) return;
    const count = (kind === "stars" || kind === "particle") ? 22 : 12;
    for(let i=0;i<count;i++){
      const span = document.createElement("span");
      span.className = "deco-item " + (kind==="stars" ? "star" : "floaty");
      span.textContent = map[kind];
      span.style.left = (Math.random()*96)+"%";
      span.style.fontSize = (kind==="stars" ? (8+Math.random()*10) : (14+Math.random()*14))+"px";
      if(kind === "stars"){
        span.style.top = (Math.random()*94)+"%";
        span.style.animationDelay = (Math.random()*2.2)+"s";
        span.style.opacity = ".7";
      } else {
        span.style.bottom = "-10%";
        span.style.animationDuration = (5+Math.random()*5)+"s";
        span.style.animationDelay = (Math.random()*5)+"s";
      }
      layerEl.appendChild(span);
    }
  });
}

function renderSlideEl(s, data){
  const el = document.createElement("div");
  el.className = "vw-slide slide-" + s.type;
  applyBackground(el, s.bg);

  if(s.type === "opening"){
    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <div class="deco-layer"></div>
      <div class="opening-inner ${animClass(s.anim)}" style="font-family:${s.font||"inherit"};color:${s.color||"inherit"}">
        <h1 style="font-size:${s.fontSize||56}px">${escapeHtml(s.title||"")}</h1>
        ${s.subtitle ? `<p class="subtitle">${escapeHtml(s.subtitle)}</p>` : ""}
      </div>`;
    while(wrap.firstChild) el.appendChild(wrap.firstChild);
    spawnDecorations(el.querySelector(".deco-layer"), s.decoration);
  }
  else if(s.type === "text"){
    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <div class="deco-layer"></div>
      <div class="text-inner layout-${s.layout||"center"} ${animClass(s.anim)}" style="font-family:${s.font||"inherit"};color:${s.color||"inherit"}">
        <h2 style="font-size:${s.fontSize||34}px">${escapeHtml(s.title||"")}</h2>
        <p>${escapeHtml(s.text||"")}</p>
      </div>`;
    while(wrap.firstChild) el.appendChild(wrap.firstChild);
    spawnDecorations(el.querySelector(".deco-layer"), s.decoration);
  }
  else if(s.type === "gallery"){
    const wrap = document.createElement("div");
    wrap.className = "gallery-inner";
    [0,1,2].forEach(i=>{
      const img = document.createElement("img");
      img.className = "gallery-photo"; img.dataset.i = i;
      img.src = s.photos && s.photos[i] ? s.photos[i] : PLACEHOLDER_IMG;
      img.style.opacity = "0";
      wrap.appendChild(img);
    });
    el.appendChild(wrap);
  }
  else if(s.type === "poster"){
    const lastPhoto = (data.slides[2] && data.slides[2].photos && data.slides[2].photos[2]) || PLACEHOLDER_IMG;
    const wrap = document.createElement("div");
    wrap.className = "poster-inner";
    wrap.innerHTML = `
      <img class="poster-photo" src="${lastPhoto}">
      <div class="poster-text ${animClass(s.anim)}" style="opacity:0;color:${s.color||"inherit"}">${escapeHtml(s.text||"")}</div>`;
    el.appendChild(wrap);
  }
  else if(s.type === "closing"){
    const wrap = document.createElement("div");
    wrap.innerHTML = `
      <div class="deco-layer"></div>
      <div class="closing-inner anim-fadeIn">
        ${s.photo ? `<img class="closing-photo" src="${s.photo}">` : ""}
        ${s.video ? `<video class="closing-video" src="${s.video}" autoplay muted loop playsinline></video>` : ""}
        <h2>${escapeHtml(s.title||"")}</h2>
        ${s.paragraph ? `<p>${escapeHtml(s.paragraph)}</p>` : ""}
        ${s.quote ? `<blockquote>&ldquo;${escapeHtml(s.quote)}&rdquo;</blockquote>` : ""}
        <div class="finish-indicator" style="opacity:0">
          <button class="repeat-btn">↻ Ulangi</button>
        </div>
      </div>`;
    while(wrap.firstChild) el.appendChild(wrap.firstChild);
    spawnDecorations(el.querySelector(".deco-layer"), s.decoration);
  }
  return el;
}

function runGallerySequence(el, s, onDone){
  const imgs = el.querySelectorAll(".gallery-photo");
  const animCls = animClass(s.anim);
  const HOLD = 3000;
  function showPhoto(i){
    if(i >= imgs.length){ setTimeout(onDone, 3000); return; }
    const img = imgs[i];
    img.classList.remove(animCls); void img.offsetWidth;
    img.style.opacity = "1"; img.classList.add(animCls);
    setTimeout(()=>{
      if(i === imgs.length - 1){ setTimeout(onDone, 3000); return; } // last photo stays
      setTimeout(()=>{
        img.style.transition = "opacity .6s ease";
        img.style.opacity = "0";
        setTimeout(()=> showPhoto(i+1), 650);
      }, HOLD);
    }, 50);
  }
  showPhoto(0);
}

function runPosterSequence(el, s, onDone){
  const photo = el.querySelector(".poster-photo");
  const text = el.querySelector(".poster-text");
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=> photo.classList.add("settled"));
  });
  setTimeout(()=>{
    text.style.opacity = "1";
  }, 900);
  setTimeout(onDone, 900 + 900 + 3000);
}

function runClosingSequence(el, s, onDone, repeatCb){
  const finish = el.querySelector(".finish-indicator");
  const repeatBtn = el.querySelector(".repeat-btn");
  setTimeout(()=>{
    finish.style.opacity = "1";
  }, 2200);
  if(repeatBtn) repeatBtn.onclick = repeatCb;
}

function buildProgressDots(container, total, current){
  container.innerHTML = "";
  for(let i=0;i<total;i++){
    const dot = document.createElement("span");
    dot.className = "vw-dot" + (i<=current ? " active" : "");
    container.appendChild(dot);
  }
}

/* ---- The main runtime engine, shared by in-editor Preview and export ---- */
function runViewer(root, data, opts){
  opts = opts || {};
  root.innerHTML = "";
  const styleTag = document.createElement("style");
  styleTag.textContent = ANIM_CSS + VIEWER_CSS;
  root.appendChild(styleTag);

  const vw = document.createElement("div");
  vw.className = "vwRoot";
  vw.innerHTML = `
    <div class="vw-stage" id="vwStage"></div>
    <div class="vw-progress" id="vwProgress"></div>
    <button class="vw-next" id="vwNext" style="display:none">Lanjut →</button>
    <div class="vw-player" id="vwPlayer">
      <div class="vw-disc"></div>
      <div>
        <div class="vw-track-name" id="vwTrackName"></div>
        <div class="vw-eq"><span></span><span></span><span></span><span></span></div>
      </div>
    </div>
    ${opts.allowExit ? '<button class="vw-exit" id="vwExit">✕ Tutup Preview</button>' : ""}
  `;
  root.appendChild(vw);
  applyTheme(vw, data);

  const stage = vw.querySelector("#vwStage");
  const progressEl = vw.querySelector("#vwProgress");
  const nextBtn = vw.querySelector("#vwNext");
  let idx = 0;
  let musicEl = null;

  if(opts.allowExit){
    vw.querySelector("#vwExit").onclick = ()=> opts.onExit && opts.onExit();
  }

  if(data.music && data.music.data){
    musicEl = document.createElement("audio");
    musicEl.src = data.music.data; musicEl.loop = true;
    vw.appendChild(musicEl);
    vw.querySelector("#vwTrackName").textContent = data.music.name || "Lagu";
    const tryPlay = ()=> musicEl.play().catch(()=>{
      const resume = ()=>{ musicEl.play().catch(()=>{}); };
      root.addEventListener("click", resume, {once:true});
    });
    tryPlay();
  } else {
    const player = vw.querySelector("#vwPlayer");
    if(player) player.style.display = "none";
  }

  function showSlide(i){
    idx = i;
    nextBtn.style.display = "none";
    stage.innerHTML = "";
    const sdata = data.slides[i];
    const el = renderSlideEl(sdata, data);
    stage.appendChild(el);
    buildProgressDots(progressEl, data.slides.length, idx);
    schedule(sdata, el);
  }

  function schedule(sdata, el){
    if(sdata.type === "gallery"){
      runGallerySequence(el, sdata, revealNext);
    } else if(sdata.type === "poster"){
      runPosterSequence(el, sdata, revealNext);
    } else if(sdata.type === "closing"){
      runClosingSequence(el, sdata, ()=>{}, ()=> showSlide(0));
    } else {
      setTimeout(revealNext, 3000);
    }
  }

  function revealNext(){
    if(idx < data.slides.length - 1){
      nextBtn.style.display = "block";
      nextBtn.onclick = ()=> showSlide(idx + 1);
    }
  }

  showSlide(0);
  return { destroy(){ if(musicEl){ musicEl.pause(); } root.innerHTML = ""; } };
}
</script>

<script>
/* ========================================================================
   SECTION 4 — EDITOR APPLICATION (Editor Mode only; not part of export)
   ======================================================================== */

function defaultState(){
  return {
    theme: "classicPink",
    customColors: null,
    music: null, // {name, data}
    slides: [
      { type:"opening", title:"Untuk Kamu Yang Istimewa", subtitle:"Sebuah kisah kecil, ditulis dengan hati",
        bg:{type:"gradient", value:"linear-gradient(135deg,#ffd6e4,#ffb6c9 60%,#ff9ebd)"},
        font:"Georgia, serif", fontSize:52, color:"#5b2340", anim:"fadeIn", decoration:["sakura"] },
      { type:"text", title:"Setiap Hari Bersamamu", text:"Adalah hari yang paling kutunggu.\nTerima kasih sudah menjadi bagian dari ceritaku.",
        bg:{type:"color", value:"#fff0f5"}, font:"Georgia, serif", fontSize:32, color:"#4a2436", anim:"slideUp", layout:"center", decoration:["stars"] },
      { type:"gallery", photos:[null,null,null], anim:"fadeIn" },
      { type:"poster", text:"Kenangan yang selalu kubawa ke mana pun aku pergi.", anim:"softReveal", color:"#4a2436" },
      { type:"closing", title:"Terima Kasih", paragraph:"Untuk setiap momen, setiap tawa, dan setiap cerita yang kita tulis bersama.",
        quote:"Kamu adalah bab favoritku.", photo:null, video:null, decoration:["heart","sparkle"] }
    ]
  };
}

let state = defaultState();
let currentSlide = 0;
let activeTab = "slides";

const $ = sel => document.querySelector(sel);
const panelEl = $("#panel");
const canvasFrame = $("#canvasFrame");
const slideCountLbl = $("#slideCountLbl");

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._h); toast._h = setTimeout(()=> t.classList.remove("show"), 2200);
}

function fileToDataUrl(file, cb){
  const reader = new FileReader();
  reader.onload = ()=> cb(reader.result);
  reader.readAsDataURL(file);
}

/* ---------------- Rail navigation ---------------- */
document.querySelectorAll(".railbtn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".railbtn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    activeTab = btn.dataset.tab;
    renderPanel();
  });
});

/* ---------------- Panel rendering ---------------- */
function renderPanel(){
  if(activeTab === "slides") return renderSlidesPanel();
  if(activeTab === "theme") return renderThemePanel();
  if(activeTab === "music") return renderMusicPanel();
  if(activeTab === "settings") return renderSettingsPanel();
}

function slideTypeLabel(t){
  return {opening:"Opening", text:"Teks", gallery:"Galeri Foto", poster:"Poster", closing:"Penutup"}[t] || t;
}

function renderSlidesPanel(){
  const s = state.slides[currentSlide];
  let html = `<h3>Timeline Slide</h3>`;
  state.slides.forEach((sl,i)=>{
    html += `<div class="timeline-item ${i===currentSlide?"active":""}" data-goto="${i}">
      <div class="num">${i+1}</div>
      <div><div class="lbl">Slide ${i+1}</div><div class="sub">${slideTypeLabel(sl.type)}</div></div>
    </div>`;
  });
  html += `<h3 style="margin-top:18px">Isi Slide ${currentSlide+1}</h3>`;

  if(s.type === "opening" || s.type === "text"){
    html += `
      <div class="field"><label>Judul</label><input type="text" id="f_title" value="${escAttr(s.title)}"></div>
      ${s.type==="opening" ? `<div class="field"><label>Subjudul (opsional)</label><input type="text" id="f_subtitle" value="${escAttr(s.subtitle||"")}"></div>` : ""}
      ${s.type==="text" ? `<div class="field"><label>Isi Teks</label><textarea id="f_text">${escapeHtml(s.text||"")}</textarea></div>` : ""}
      <div class="field"><label>Background</label>
        <select id="f_bgtype">
          <option value="color" ${s.bg.type==="color"?"selected":""}>Warna Polos</option>
          <option value="gradient" ${s.bg.type==="gradient"?"selected":""}>Gradient</option>
          <option value="image" ${s.bg.type==="image"?"selected":""}>Gambar</option>
          <option value="video" ${s.bg.type==="video"?"selected":""}>Video Pendek</option>
        </select>
      </div>
      ${renderBgValueField(s)}
      <div class="field"><label>Ukuran Font (${s.fontSize||(s.type==="opening"?52:32)}px)</label>
        <input type="range" id="f_fontsize" min="18" max="90" value="${s.fontSize||(s.type==="opening"?52:32)}"></div>
      <div class="field"><label>Jenis Font</label>
        <select id="f_font">
          <option value="Georgia, serif" ${s.font.includes("Georgia")?"selected":""}>Elegant Serif</option>
          <option value="'Segoe UI', sans-serif" ${s.font.includes("Segoe")?"selected":""}>Modern Sans</option>
          <option value="'Brush Script MT', cursive" ${s.font.includes("Brush")?"selected":""}>Script / Tulisan Tangan</option>
          <option value="'Courier New', monospace" ${s.font.includes("Courier")?"selected":""}>Monospace</option>
        </select>
      </div>
      <div class="field"><label>Warna Teks</label><input type="color" class="colorinput" id="f_color" value="${s.color||"#4a2436"}"></div>
      <div class="field"><label>Animasi Masuk</label>${animSelect("f_anim", s.anim)}</div>
      ${s.type==="text" ? `<div class="field"><label>Layout</label>
        <select id="f_layout">
          <option value="center" ${s.layout==="center"?"selected":""}>Center</option>
          <option value="left" ${s.layout==="left"?"selected":""}>Kiri</option>
          <option value="right" ${s.layout==="right"?"selected":""}>Kanan</option>
        </select></div>` : ""}
      <div class="field"><label>Efek Dekorasi</label>${decorationChecks(s.decoration, DECORATIONS.filter(d=>d!=="none"))}</div>
    `;
  }
  else if(s.type === "gallery"){
    html += `
      <div class="field"><label>Tiga Foto (berurutan)</label>
        <div class="photogrid">
          ${[0,1,2].map(i=>`
            <div style="flex:1;position:relative">
              <label class="uploadbox">Foto ${i+1}
                <input type="file" accept="image/*" data-photo="${i}">
                ${s.photos[i] ? `<img src="${s.photos[i]}">` : ""}
              </label>
              ${s.photos[i] ? `<button class="small-btn" data-photo-remove="${i}" style="margin-top:6px">🗑 Hapus</button>` : ""}
            </div>`).join("")}
        </div>
      </div>
      <div class="field"><label>Animasi Transisi</label>
        <select id="f_gallery_anim">
          ${GALLERY_ANIMATIONS.map(a=>`<option value="${a}" ${s.anim===a?"selected":""}>${a}</option>`).join("")}
        </select>
      </div>
      <p class="hint">Setiap foto tampil ± 3 detik lalu berpindah otomatis ke foto berikutnya. Foto ke-3 akan tetap ditampilkan dan digunakan kembali di Slide 4. Klik <b>▶ Preview</b> di atas untuk melihat urutan animasinya — canvas editor hanya menampilkan susunan statis ketiga foto.</p>
    `;
  }
  else if(s.type === "poster"){
    const lastPhoto = state.slides[2].photos[2];
    html += `
      <div class="field"><label>Foto (otomatis dari foto ke-3 Slide 3)</label>
        <div class="uploadbox" style="cursor:default">
          <img src="${lastPhoto || PLACEHOLDER_IMG}">
        </div>
      </div>
      <div class="field"><label>Teks Poster</label><textarea id="f_text">${escapeHtml(s.text||"")}</textarea></div>
      <div class="field"><label>Warna Teks</label><input type="color" class="colorinput" id="f_color" value="${s.color||"#4a2436"}"></div>
      <div class="field"><label>Animasi Teks</label>${animSelect("f_anim", s.anim)}</div>
      <p class="hint">Foto mengecil secara smooth lalu bergerak ke atas-tengah, kemudian teks muncul di bawahnya. Klik <b>▶ Preview</b> untuk melihat urutan animasi ini berjalan.</p>
    `;
  }
  else if(s.type === "closing"){
    html += `
      <div class="field"><label>Judul</label><input type="text" id="f_title" value="${escAttr(s.title)}"></div>
      <div class="field"><label>Paragraf</label><textarea id="f_paragraph">${escapeHtml(s.paragraph||"")}</textarea></div>
      <div class="field"><label>Quote (opsional)</label><input type="text" id="f_quote" value="${escAttr(s.quote||"")}"></div>
      <div class="field"><label>Foto (opsional)</label>
        <label class="uploadbox">Klik untuk unggah foto
          <input type="file" accept="image/*" id="f_photo">
          ${s.photo ? `<img src="${s.photo}">` : ""}
        </label>
        ${s.photo ? `<button class="small-btn" id="f_photo_remove" style="margin-top:6px">🗑 Hapus Foto</button>` : ""}
      </div>
      <div class="field"><label>Video (opsional)</label>
        <label class="uploadbox">Klik untuk unggah video
          <input type="file" accept="video/*" id="f_video">
          ${s.video ? `<div class="hint">✓ Video terpasang</div>` : ""}
        </label>
        ${s.video ? `<button class="small-btn" id="f_video_remove" style="margin-top:6px">🗑 Hapus Video</button>` : ""}
      </div>
      <div class="field"><label>Dekorasi Penutup</label>${decorationChecks(s.decoration, CLOSING_DECORATIONS)}</div>
      <p class="hint">Setelah animasi selesai, tombol Repeat akan muncul otomatis untuk mengulang presentasi dari awal.</p>
    `;
  }

  panelEl.innerHTML = html;
  bindSlidesPanelEvents();
  slideCountLbl.textContent = `Slide ${currentSlide+1} / ${state.slides.length} — ${slideTypeLabel(s.type)}`;
  renderCanvas();
}

function renderBgValueField(s){
  if(s.bg.type === "color"){
    return `<div class="field"><input type="color" class="colorinput" id="f_bgcolor" value="${s.bg.value && s.bg.value.startsWith("#") ? s.bg.value : "#fff0f5"}"></div>`;
  }
  if(s.bg.type === "gradient"){
    const presets = [
      "linear-gradient(135deg,#ffd6e4,#ffb6c9 60%,#ff9ebd)",
      "linear-gradient(135deg,#fdeff2,#e0c3fc)",
      "linear-gradient(135deg,#0b0620,#3b1a4a)",
      "linear-gradient(135deg,#ffe8d6,#ffb997)",
      "linear-gradient(135deg,#c2e9fb,#a1c4fd)"
    ];
    return `<div class="field swatchrow" id="f_gradient">
      ${presets.map(p=>`<div class="swatch ${s.bg.value===p?"active":""}" data-grad="${escAttr(p)}" style="background:${p}"></div>`).join("")}
    </div>`;
  }
  if(s.bg.type === "image"){
    return `<div class="field"><label class="uploadbox">Klik untuk unggah gambar
      <input type="file" accept="image/*" id="f_bgimage">
      ${s.bg.value ? `<img src="${s.bg.value}">` : ""}
    </label>
    ${s.bg.value ? `<button class="small-btn" id="f_bgimage_remove" style="margin-top:6px">🗑 Hapus Gambar</button>` : ""}
    </div>`;
  }
  if(s.bg.type === "video"){
    return `<div class="field"><label class="uploadbox">Klik untuk unggah video pendek
      <input type="file" accept="video/*" id="f_bgvideo">
      ${s.bg.value ? `<div class="hint">✓ Video terpasang</div>` : ""}
    </label>
    ${s.bg.value ? `<button class="small-btn" id="f_bgvideo_remove" style="margin-top:6px">🗑 Hapus Video</button>` : ""}
    </div>`;
  }
  return "";
}

function animSelect(id, current){
  return `<select id="${id}">${ANIMATIONS.map(a=>`<option value="${a}" ${current===a?"selected":""}>${a}</option>`).join("")}</select>`;
}

function decorationChecks(current, options){
  current = current || [];
  return `<div>${options.map(o=>`
    <label class="checkrow"><input type="checkbox" data-deco="${o}" ${current.includes(o)?"checked":""}> ${o}</label>
  `).join("")}</div>`;
}

function escAttr(str){ return (str||"").replace(/"/g,"&quot;"); }

function bindSlidesPanelEvents(){
  panelEl.querySelectorAll("[data-goto]").forEach(el=>{
    el.addEventListener("click", ()=>{ currentSlide = parseInt(el.dataset.goto); renderPanel(); });
  });
  const s = state.slides[currentSlide];

  const t = id => panelEl.querySelector("#"+id);
  if(t("f_title")) t("f_title").addEventListener("input", e=>{ s.title = e.target.value; renderCanvas(); });
  if(t("f_subtitle")) t("f_subtitle").addEventListener("input", e=>{ s.subtitle = e.target.value; renderCanvas(); });
  if(t("f_text")) t("f_text").addEventListener("input", e=>{ s.text = e.target.value; renderCanvas(); });
  if(t("f_paragraph")) t("f_paragraph").addEventListener("input", e=>{ s.paragraph = e.target.value; renderCanvas(); });
  if(t("f_quote")) t("f_quote").addEventListener("input", e=>{ s.quote = e.target.value; renderCanvas(); });
  if(t("f_fontsize")) t("f_fontsize").addEventListener("input", e=>{ s.fontSize = parseInt(e.target.value); renderPanel(); });
  if(t("f_font")) t("f_font").addEventListener("change", e=>{ s.font = e.target.value; renderCanvas(); });
  if(t("f_color")) t("f_color").addEventListener("input", e=>{ s.color = e.target.value; renderCanvas(); });
  if(t("f_layout")) t("f_layout").addEventListener("change", e=>{ s.layout = e.target.value; renderCanvas(); });
  if(t("f_anim")) t("f_anim").addEventListener("change", e=>{ s.anim = e.target.value; renderCanvas(); });
  if(t("f_gallery_anim")) t("f_gallery_anim").addEventListener("change", e=>{ s.anim = e.target.value; toast("Animasi transisi diperbarui — cek lewat Preview"); });
  if(t("f_bgtype")) t("f_bgtype").addEventListener("change", e=>{ s.bg = {type:e.target.value, value:""}; renderPanel(); });
  if(t("f_bgcolor")) t("f_bgcolor").addEventListener("input", e=>{ s.bg.value = e.target.value; renderCanvas(); });
  panelEl.querySelectorAll("[data-grad]").forEach(el=> el.addEventListener("click", ()=>{ s.bg.value = el.dataset.grad; renderPanel(); }));
  if(t("f_bgimage")) t("f_bgimage").addEventListener("change", e=>{ const f=e.target.files[0]; if(f) fileToDataUrl(f, d=>{ s.bg.value=d; renderPanel(); }); });
  if(t("f_bgvideo")) t("f_bgvideo").addEventListener("change", e=>{ const f=e.target.files[0]; if(f) fileToDataUrl(f, d=>{ s.bg.value=d; renderPanel(); toast("Video background terpasang"); }); });
  if(t("f_photo")) t("f_photo").addEventListener("change", e=>{ const f=e.target.files[0]; if(f) fileToDataUrl(f, d=>{ s.photo=d; renderPanel(); }); });
  if(t("f_video")) t("f_video").addEventListener("change", e=>{ const f=e.target.files[0]; if(f) fileToDataUrl(f, d=>{ s.video=d; renderPanel(); toast("Video terpasang"); }); });
  panelEl.querySelectorAll("[data-photo]").forEach(inp=>{
    inp.addEventListener("change", e=>{
      const i = parseInt(inp.dataset.photo); const f = e.target.files[0];
      if(f) fileToDataUrl(f, d=>{ s.photos[i] = d; renderPanel(); });
    });
  });
  // ---- Delete buttons ----
  if(t("f_bgimage_remove")) t("f_bgimage_remove").addEventListener("click", ()=>{ s.bg.value = ""; renderPanel(); toast("Gambar background dihapus"); });
  if(t("f_bgvideo_remove")) t("f_bgvideo_remove").addEventListener("click", ()=>{ s.bg.value = ""; renderPanel(); toast("Video background dihapus"); });
  if(t("f_photo_remove")) t("f_photo_remove").addEventListener("click", ()=>{ s.photo = null; renderPanel(); toast("Foto dihapus"); });
  if(t("f_video_remove")) t("f_video_remove").addEventListener("click", ()=>{ s.video = null; renderPanel(); toast("Video dihapus"); });
  panelEl.querySelectorAll("[data-photo-remove]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const i = parseInt(btn.dataset.photoRemove);
      s.photos[i] = null;
      renderPanel();
      toast("Foto " + (i+1) + " dihapus");
    });
  });
  panelEl.querySelectorAll("[data-deco]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const set = new Set(s.decoration||[]);
      if(cb.checked) set.add(cb.dataset.deco); else set.delete(cb.dataset.deco);
      s.decoration = Array.from(set);
      renderCanvas();
    });
  });
}

function applyThemeToAllSlides(){
  // Restyle every slide's background/text/font to match the active theme.
  // Slides where the user uploaded their own photo/video background are left untouched
  // so a theme change never destroys an uploaded asset.
  const c = themeVars(state);
  state.slides.forEach(s=>{
    if(s.type === "opening" || s.type === "closing"){
      if(!s.bg || s.bg.type === "color" || s.bg.type === "gradient"){
        s.bg = {type:"gradient", value:`linear-gradient(135deg, ${c.secondary}, ${c.primary})`};
      }
    } else if(s.type === "text"){
      if(!s.bg || s.bg.type === "color" || s.bg.type === "gradient"){
        s.bg = {type:"color", value:c.bg};
      }
    }
    if("color" in s) s.color = c.text;
    if("font" in s) s.font = c.font;
  });
}

function renderThemePanel(){
  const c = themeVars(state);
  let html = `<h3>Pilih Tema</h3><div class="themegrid">`;
  Object.entries(THEMES).forEach(([key,t])=>{
    html += `<div class="themecard ${state.theme===key && !state.customColors ? "active":""}" data-theme="${key}"
      style="background:linear-gradient(135deg,${t.primary},${t.secondary})">${t.label}</div>`;
  });
  html += `</div>`;
  html += `<h3 style="margin-top:20px">Kustomisasi Warna</h3>
    <div class="field"><label>Warna Utama</label><input type="color" class="colorinput" id="c_primary" value="${c.primary}"></div>
    <div class="field"><label>Warna Sekunder</label><input type="color" class="colorinput" id="c_secondary" value="${c.secondary}"></div>
    <div class="field"><label>Warna Background</label><input type="color" class="colorinput" id="c_bg" value="${c.bg}"></div>
    <div class="field"><label>Warna Teks</label><input type="color" class="colorinput" id="c_text" value="${c.text}"></div>
    <button class="small-btn" id="c_reset">Reset ke Preset Tema</button>
    <p class="hint">Memilih tema atau mengubah warna akan langsung menata ulang background dan warna teks di seluruh slide (foto/video yang sudah diunggah tidak akan terhapus).</p>`;
  panelEl.innerHTML = html;

  panelEl.querySelectorAll("[data-theme]").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.theme = el.dataset.theme; state.customColors = null;
      applyThemeToAllSlides();
      renderThemePanel(); renderCanvas();
      toast("Tema diterapkan ke seluruh slide");
    });
  });
  const bind = (id, key) => panelEl.querySelector("#"+id).addEventListener("input", e=>{
    state.customColors = state.customColors || {};
    state.customColors[key] = e.target.value;
    applyThemeToAllSlides();
    renderCanvas();
  });
  bind("c_primary","primary"); bind("c_secondary","secondary"); bind("c_bg","bg"); bind("c_text","text");
  panelEl.querySelector("#c_reset").addEventListener("click", ()=>{
    state.customColors = null;
    applyThemeToAllSlides();
    renderThemePanel(); renderCanvas();
  });
}

function renderMusicPanel(){
  let html = `<h3>Musik Latar</h3>`;
  html += `<label class="uploadbox">Klik untuk unggah musik (mp3 / wav / ogg)
    <input type="file" accept="audio/mp3,audio/wav,audio/ogg,.mp3,.wav,.ogg" id="f_music">
  </label>`;
  if(state.music){
    html += `<div class="field" style="margin-top:12px">
      <div class="hint">♫ ${escapeHtml(state.music.name)}</div>
      <audio controls src="${state.music.data}" style="width:100%;margin-top:6px"></audio>
      <button class="small-btn" id="f_music_remove" style="margin-top:8px">Hapus Musik</button>
    </div>`;
  }
  html += `<p class="hint">Musik akan diputar otomatis saat presentasi dibuka (jika diizinkan browser), atau mulai setelah interaksi pertama pengguna. Mini player ditampilkan di kiri bawah.</p>`;
  panelEl.innerHTML = html;
  panelEl.querySelector("#f_music").addEventListener("change", e=>{
    const f = e.target.files[0];
    if(f) fileToDataUrl(f, d=>{ state.music = {name:f.name, data:d}; renderMusicPanel(); toast("Musik ditambahkan"); });
  });
  if(panelEl.querySelector("#f_music_remove")){
    panelEl.querySelector("#f_music_remove").addEventListener("click", ()=>{ state.music = null; renderMusicPanel(); });
  }
}

function renderSettingsPanel(){
  panelEl.innerHTML = `
    <h3>Pengaturan Project</h3>
    <p class="hint">Aplikasi ini berjalan sepenuhnya offline di browser — tanpa server, tanpa koneksi internet. Semua foto, video, dan musik disimpan langsung sebagai bagian dari project (Base64).</p>
    <button class="small-btn" id="s_reset" style="margin-top:10px">🗑 Reset Project ke Default</button>
    <h3 style="margin-top:20px">Tentang Mode</h3>

    <p class="hint"><b>Viewer Mode</b>: dihasilkan lewat tombol <b>Export HTML</b> di atas — satu file HTML mandiri yang hanya bisa ditonton, tidak bisa diedit.</p>
  `;
  panelEl.querySelector("#s_reset").addEventListener("click", ()=>{

/* ---------------- Canvas (live preview / editable) ---------------- */
function renderCanvas(){
  canvasFrame.innerHTML = "";
  const styleTag = document.createElement("style");
  styleTag.textContent = ANIM_CSS + VIEWER_CSS;
  canvasFrame.appendChild(styleTag);
  const vw = document.createElement("div");
  vw.className = "vwRoot";
  canvasFrame.appendChild(vw);
  applyTheme(vw, state);
  const s = state.slides[currentSlide];
  const el = renderSlideEl(s, state);
  el.style.position = "absolute"; el.style.inset = "0";
  vw.appendChild(el);

  // Gallery: show all 3 in static grid for editing context
  if(s.type === "gallery"){
    el.querySelectorAll(".gallery-photo").forEach((img,i)=>{
      img.style.opacity = "1";
      img.style.width = "28%"; img.style.height = "80%"; img.style.inset = "auto";
      img.style.left = (4 + i*32) + "%"; img.style.top = "10%";
    });
  }
  // Poster: show settled state directly for editing context
  if(s.type === "poster"){
    requestAnimationFrame(()=>{ el.querySelector(".poster-photo").classList.add("settled"); el.querySelector(".poster-text").style.opacity = "1"; });
  }
  // Closing: reveal finish indicator dimly for context
  if(s.type === "closing"){
    const fi = el.querySelector(".finish-indicator"); if(fi) fi.style.opacity = ".55";
  }

  // contenteditable bindings for direct-on-canvas editing
  makeEditable(el, "h1", v=>{ s.title = v; });
  makeEditable(el, "h2", v=>{ s.title = v; });
  makeEditable(el, ".subtitle", v=>{ s.subtitle = v; });
  makeEditable(el, ".text-inner p", v=>{ s.text = v; });
  makeEditable(el, ".poster-text", v=>{ s.text = v; });
  makeEditable(el, ".closing-inner p", v=>{ s.paragraph = v; });
  makeEditable(el, "blockquote", v=>{ s.quote = v.replace(/[\u201c\u201d]/g,""); });
}

function makeEditable(root, sel, onChange){
  const node = root.querySelector(sel);
  if(!node) return;
  node.contentEditable = "true";
  node.style.outline = "none";
  node.addEventListener("focus", ()=> node.style.boxShadow = "0 0 0 2px rgba(255,255,255,.5)");
  node.addEventListener("blur", ()=>{ node.style.boxShadow = "none"; onChange(node.textContent); });
}

/* ---------------- Top bar actions ---------------- */
$("#btnPreview").addEventListener("click", openPreview);
$("#btnSave").addEventListener("click", saveProject);
$("#btnLoad").addEventListener("click", openLoadModal);
$("#btnExport").addEventListener("click", exportViewer);

function openPreview(){
  const overlay = $("#viewerOverlay");
  overlay.classList.add("show");
  runViewer(overlay, JSON.parse(JSON.stringify(state)), {
    allowExit: true,
    onExit: ()=>{ overlay.classList.remove("show"); overlay.innerHTML = ""; }
  });
}

function saveProject(){
  try{
    const key = "rpb_project_" + Date.now();
    localStorage.setItem(key, JSON.stringify(state));
    const idx = JSON.parse(localStorage.getItem("rpb_index") || "[]");
    idx.push({key, name: "Project " + new Date().toLocaleString("id-ID")});
    localStorage.setItem("rpb_index", JSON.stringify(idx));
    toast("Project berhasil disimpan ke browser");
  }catch(e){
    toast("Gagal menyimpan: penyimpanan penuh atau tidak didukung");
  }
}

function openLoadModal(){
  const idx = JSON.parse(localStorage.getItem("rpb_index") || "[]");
  const list = $("#loadList");
  list.innerHTML = idx.length ? "" : `<p class="hint">Belum ada project tersimpan.</p>`;
  idx.slice().reverse().forEach(item=>{
    const row = document.createElement("div");
    row.className = "timeline-item";
    row.innerHTML = `<div class="num">📁</div><div><div class="lbl">${escapeHtml(item.name)}</div></div>`;
    row.addEventListener("click", ()=>{
      const raw = localStorage.getItem(item.key);
      if(raw){ state = JSON.parse(raw); currentSlide = 0; renderPanel(); toast("Project dimuat"); }
      $("#loadModal").classList.remove("show");
    });
    list.appendChild(row);
  });
  $("#loadModal").classList.add("show");
}
$("#loadCancel").addEventListener("click", ()=> $("#loadModal").classList.remove("show"));

/* ---------------- Export: builds one standalone HTML file (Viewer Mode) ---------------- */
function exportViewer(){
  const data = JSON.parse(JSON.stringify(state));
  const dataJson = JSON.stringify(data).replace(/</g, "\\u003c");

  const html = `<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${escapeHtml(data.slides[0].title || "Presentasi Romantis")}</title>
<style>
  html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#000;}
  #viewerRoot{position:fixed;inset:0;}
</style>
</head>
<body>
<div id="viewerRoot"></div>
<script>
const PLACEHOLDER_IMG = ${JSON.stringify(PLACEHOLDER_IMG)};
const ANIM_CSS = ${JSON.stringify(ANIM_CSS)};
const VIEWER_CSS = ${JSON.stringify(VIEWER_CSS)};
const THEMES = ${JSON.stringify(THEMES)};
const DATA = ${dataJson};

function animClass(name){ return "anim-"+(name||"fadeIn"); }
${escapeHtml.toString()}
${themeVars.toString()}
${applyTheme.toString()}
${applyBackground.toString()}
${spawnDecorations.toString()}
${renderSlideEl.toString()}
${runGallerySequence.toString()}
${runPosterSequence.toString()}
${runClosingSequence.toString()}
${buildProgressDots.toString()}
${runViewer.toString()}

runViewer(document.getElementById("viewerRoot"), DATA, {allowExit:false});
<\/script>
</body>
</html>`;

  const blob = new Blob([html], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "presentasi-romantis.html";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast("File HTML presentasi berhasil diunduh");
}

/* ---------------- Init ---------------- */
renderPanel();
</script>
</body>
</html>

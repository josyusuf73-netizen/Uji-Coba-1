<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video to Standalone HTML Exporter</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        header {
            margin-bottom: 28px;
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #fff;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 220px;
            background-color: rgba(15, 23, 42, 0.4);
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent);
            background-color: rgba(59, 130, 246, 0.05);
        }

        .drop-zone svg {
            width: 48px;
            height: 48px;
            fill: var(--text-muted);
            margin-bottom: 12px;
        }

        .drop-zone p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .drop-zone span {
            color: var(--accent);
            font-weight: 600;
        }

        #fileInput {
            display: none;
        }

        .config-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-control {
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 4px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--text-main);
        }

        .checkbox-label input {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
        }

        .preview-container {
            margin-top: 24px;
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .preview-container video {
            width: 100%;
            max-height: 250px;
            border-radius: 8px;
            background-color: #000;
            border: 1px solid var(--border);
        }

        .file-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .actions {
            margin-top: 28px;
        }

        .btn-export {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease, opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-export:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .btn-export:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--bg-primary);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 12px;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--accent);
            transition: width 0.2s ease;
        }

        .status-text {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 8px;
            min-height: 1.2em;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Video-to-HTML Exporter</h1>
        <p>Ubah berkas video menjadi halaman web HTML standalone yang otomatis berputar.</p>
    </header>

    <div class="grid-layout">
        <div>
            <div class="drop-zone" id="dropZone">
                <svg viewBox="0 0 24 24">
                    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                </svg>
                <p>Seret berkas video ke sini atau <span>Cari Berkas</span></p>
                <input type="file" id="fileInput" accept="video/*">
            </div>

            <div class="preview-container" id="previewContainer">
                <video id="videoPreview" controls></video>
                <div class="file-info">
                    <span id="fileName">-</span>
                    <span id="fileSize">-</span>
                </div>
            </div>
        </div>

        <div class="config-panel">
            <div class="form-group">
                <label for="docTitle">Judul Halaman HTML</label>
                <input type="text" id="docTitle" class="form-control" value="Pemutar Video Otomatis">
            </div>

            <div class="form-group">
                <label for="bgColor">Warna Latar Belakang</label>
                <input type="color" id="bgColor" class="form-control" value="#000000" style="height: 42px; padding: 4px; cursor: pointer;">
            </div>

            <div class="form-group">
                <label>Pengaturan Video</label>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="optAutoplay" checked> Autoplay
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="optMuted" checked> Mute (Bisu)
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="optLoop" checked> Loop (Ulang)
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="optControls" checked> Kontrol
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div class="actions">
        <button id="btnExport" class="btn-export" disabled>
            Ekspor Menjadi HTML
        </button>
        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status-text" id="statusText"></div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const videoPreview = document.getElementById('videoPreview');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const btnExport = document.getElementById('btnExport');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');

    let selectedFile = null;

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            handleFileSelect(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleFileSelect(e.target.files[0]);
        }
    });

    function handleFileSelect(file) {
        if (!file.type.startsWith('video/')) {
            alert('Silakan pilih berkas video yang valid.');
            return;
        }

        selectedFile = file;
        fileName.textContent = file.name;
        fileSize.textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';

        const videoURL = URL.createObjectURL(file);
        videoPreview.src = videoURL;
        previewContainer.style.display = 'flex';
        btnExport.disabled = false;
        statusText.textContent = 'Berkas siap untuk diekspor.';
    }

    btnExport.addEventListener('click', () => {
        if (!selectedFile) return;

        btnExport.disabled = true;
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';
        statusText.textContent = 'Membaca dan mengonversi video ke Base64...';

        const reader = new FileReader();

        reader.onprogress = (e) => {
            if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 100);
                progressBar.style.width = percent + '%';
                statusText.textContent = `Proses konversi: ${percent}%`;
            }
        };

        reader.onload = (e) => {
            statusText.textContent = 'Membuat halaman HTML...';
            const base64Data = e.target.result;
            const htmlContent = generateHTML(base64Data);
            
            downloadHTML(htmlContent, selectedFile.name.replace(/\.[^/.]+$/, "") + "_export.html");
            
            statusText.textContent = 'Ekspor selesai! Berkas telah diunduh.';
            btnExport.disabled = false;
            setTimeout(() => {
                progressContainer.style.display = 'none';
            }, 2000);
        };

        reader.onerror = () => {
            alert('Gagal membaca berkas video.');
            btnExport.disabled = false;
            progressContainer.style.display = 'none';
            statusText.textContent = '';
        };

        reader.readAsDataURL(selectedFile);
    });

    function generateHTML(base64Video) {
        const title = document.getElementById('docTitle').value || 'Pemutar Video';
        const bgColor = document.getElementById('bgColor').value;
        const autoplay = document.getElementById('optAutoplay').checked ? 'autoplay' : '';
        const muted = document.getElementById('optMuted').checked ? 'muted' : '';
        const loop = document.getElementById('optLoop').checked ? 'loop' : '';
        const controls = document.getElementById('optControls').checked ? 'controls' : '';

        return `<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${escapeHtml(title)}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: ${bgColor};
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .video-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="video-wrapper">
        <video src="${base64Video}" ${autoplay} ${muted} ${loop} ${controls} playsinline></video>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const v = document.querySelector('video');
            if (v && v.hasAttribute('autoplay')) {
                v.play().catch(err => {
                    console.log('Autoplay diblokir oleh peramban:', err);
                });
            }
        });
    <\/script>
</body>
</html>`;
    }

    function downloadHTML(content, filename) {
        const blob = new Blob([content], { type: 'text/html;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, function(m) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[m];
        });
    }
</script>
</body>
</html>

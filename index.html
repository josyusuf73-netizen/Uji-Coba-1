<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Finance Tracker</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --income: #10b981;
            --expense: #ef4444;
            --border: #334155;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            gap: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 0.95rem;
        }

        /* Dashboard Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .card-header i {
            font-size: 1.2rem;
        }

        .card-amount {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .text-income { color: var(--income); }
        .text-expense { color: var(--expense); }

        /* Main Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            align-items: start;
        }

        /* Form Section */
        .form-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
        }

        .form-section h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
        }

        select.form-control {
            appearance: none;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .btn-submit:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }

        /* History Section */
        .history-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 25px;
            height: 100%;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .history-header h2 {
            font-size: 1.2rem;
        }

        .transaction-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            max-height: 500px;
            padding-right: 5px;
        }

        .transaction-list::-webkit-scrollbar {
            width: 6px;
        }
        .transaction-list::-webkit-scrollbar-thumb {
            background-color: var(--border);
            border-radius: 10px;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
            transition: transform 0.2s;
        }

        .transaction-item:hover {
            transform: translateX(5px);
            border-color: #475569;
        }

        .tx-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .tx-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
        }

        .icon-income { background-color: rgba(16, 185, 129, 0.1); color: var(--income); }
        .icon-expense { background-color: rgba(239, 68, 68, 0.1); color: var(--expense); }

        .tx-details h4 {
            font-size: 1rem;
            margin-bottom: 3px;
        }

        .tx-details p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .tx-amount {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            display: none;
        }

        /* Toast Notification */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            background-color: var(--card-bg);
            color: var(--text-main);
            border-left: 4px solid var(--accent);
            padding: 15px 20px;
            border-radius: 6px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease-out forwards;
            opacity: 0;
        }

        .toast.success { border-color: var(--income); }
        .toast.error { border-color: var(--expense); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Global Finance Tracker</h1>
            <p>Data tersinkronisasi secara real-time untuk semua pengguna.</p>
        </header>

        <!-- Summary Cards -->
        <div class="summary-grid">
            <div class="card">
                <div class="card-header">
                    <span>Total Saldo</span>
                    <i class="fa-solid fa-wallet" style="color: var(--accent);"></i>
                </div>
                <div class="card-amount" id="totalBalance">Rp 0</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span>Total Pemasukan</span>
                    <i class="fa-solid fa-arrow-trend-up text-income"></i>
                </div>
                <div class="card-amount text-income" id="totalIncome">Rp 0</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span>Total Pengeluaran</span>
                    <i class="fa-solid fa-arrow-trend-down text-expense"></i>
                </div>
                <div class="card-amount text-expense" id="totalExpense">Rp 0</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content-grid">
            <!-- Form Input -->
            <div class="form-section">
                <h2><i class="fa-solid fa-pen-to-square"></i> Tambah Data</h2>
                <form id="transactionForm">
                    <div class="form-group">
                        <label for="type">Jenis Transaksi</label>
                        <select id="type" class="form-control" required>
                            <option value="income">Pemasukan (+)</option>
                            <option value="expense">Pengeluaran (-)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="amount">Nominal (Rp)</label>
                        <input type="number" id="amount" class="form-control" placeholder="Contoh: 50000" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Keterangan</label>
                        <input type="text" id="description" class="form-control" placeholder="Contoh: Beli makan siang, Gaji..." required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="user">Nama / Inisial Penginput</label>
                        <input type="text" id="user" class="form-control" placeholder="Contoh: Titan, Andi..." required autocomplete="off">
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Simpan Transaksi
                    </button>
                </form>
            </div>

            <!-- Transaction History -->
            <div class="history-section">
                <div class="history-header">
                    <h2><i class="fa-solid fa-list-ul"></i> Riwayat Transaksi Publik</h2>
                    <span id="connectionStatus" style="font-size: 0.8rem; color: var(--income);"><i class="fa-solid fa-circle-check"></i> Live</span>
                </div>
                
                <div class="empty-state" id="emptyState">
                    <i class="fa-solid fa-box-open" style="font-size: 3rem; margin-bottom: 10px;"></i>
                    <p>Belum ada data transaksi.<br>Jadilah yang pertama memasukkan data!</p>
                </div>

                <ul class="transaction-list" id="transactionList">
                    <!-- Data will be populated here via JavaScript -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Container for Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Firebase Logic -->
    <script type="module">
        // 1. Import SDK Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";
        // Import module Firestore untuk database
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            query, 
            orderBy, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        // 2. Firebase Configuration (Sesuai dengan milikmu)
        const firebaseConfig = {
            apiKey: "AIzaSyBj8EQ54fn783L3PHhPVg2mDzw150i5xLI",
            authDomain: "coba1-ac1f2.firebaseapp.com",
            projectId: "coba1-ac1f2",
            storageBucket: "coba1-ac1f2.firebasestorage.app",
            messagingSenderId: "229666208746",
            appId: "1:229666208746:web:97471daa3f3b0efa7b5093",
            measurementId: "G-TSP8HQQJWH"
        };

        // 3. Initialize Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // Referensi ke collection "transactions" di Firestore
        const txCollection = collection(db, "transactions");

        // 4. DOM Elements
        const form = document.getElementById('transactionForm');
        const submitBtn = document.getElementById('submitBtn');
        const transactionList = document.getElementById('transactionList');
        const emptyState = document.getElementById('emptyState');
        
        const balanceEl = document.getElementById('totalBalance');
        const incomeEl = document.getElementById('totalIncome');
        const expenseEl = document.getElementById('totalExpense');

        // Formatter Rupiah
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(number);
        };

        // Date Formatter
        const formatDate = (dateObject) => {
            if(!dateObject) return "Baru saja";
            const date = dateObject.toDate();
            return new Intl.DateTimeFormat('id-ID', {
                day: '2-digit', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            }).format(date);
        };

        // Fungsi Toast Notification
        const showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'success' ? '<i class="fa-solid fa-check-circle"></i>' : '<i class="fa-solid fa-triangle-exclamation"></i>';
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            
            // Remove after 3 seconds
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s ease-out forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // 5. Submit Data ke Firebase (CREATE)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const type = document.getElementById('type').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const description = document.getElementById('description').value;
            const user = document.getElementById('user').value;

            if (!amount || !description || !user) return;

            // UI Loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';

            try {
                // Simpan ke Firestore
                await addDoc(txCollection, {
                    type: type,
                    amount: amount,
                    description: description,
                    user: user,
                    timestamp: serverTimestamp() // Waktu server agar sinkron
                });

                form.reset();
                showToast('Transaksi berhasil disimpan!');
            } catch (error) {
                console.error("Error adding document: ", error);
                showToast('Gagal menyimpan! Cek Rules Firestore.', 'error');
            } finally {
                // Reset Button
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Simpan Transaksi';
            }
        });

        // 6. Ambil Data Real-Time (READ & SYNC)
        // Query: Urutkan berdasarkan waktu (terbaru di atas)
        const q = query(txCollection, orderBy("timestamp", "desc"));

        // onSnapshot membaca data secara otomatis setiap kali ada perubahan di database
        onSnapshot(q, (snapshot) => {
            let totalIncome = 0;
            let totalExpense = 0;
            
            transactionList.innerHTML = ''; // Kosongkan list sebelum render ulang

            if (snapshot.empty) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // Kalkulasi Total
                    if (data.type === 'income') {
                        totalIncome += data.amount;
                    } else {
                        totalExpense += data.amount;
                    }

                    // Render UI List
                    const li = document.createElement('li');
                    li.className = 'transaction-item';
                    
                    const isIncome = data.type === 'income';
                    const iconClass = isIncome ? 'fa-arrow-down' : 'fa-arrow-up';
                    const iconBg = isIncome ? 'icon-income' : 'icon-expense';
                    const amountClass = isIncome ? 'text-income' : 'text-expense';
                    const amountSign = isIncome ? '+' : '-';

                    li.innerHTML = `
                        <div class="tx-info">
                            <div class="tx-icon ${iconBg}">
                                <i class="fa-solid ${iconClass}"></i>
                            </div>
                            <div class="tx-details">
                                <h4>${data.description}</h4>
                                <p><i class="fa-regular fa-user"></i> ${data.user} &nbsp;|&nbsp; <i class="fa-regular fa-clock"></i> ${formatDate(data.timestamp)}</p>
                            </div>
                        </div>
                        <div class="tx-amount ${amountClass}">
                            ${amountSign}${formatRupiah(data.amount)}
                        </div>
                    `;
                    transactionList.appendChild(li);
                });
            }

            // Update UI Saldo
            const totalBalance = totalIncome - totalExpense;
            
            balanceEl.innerText = formatRupiah(totalBalance);
            incomeEl.innerText = formatRupiah(totalIncome);
            expenseEl.innerText = formatRupiah(totalExpense);

            // Ganti warna Saldo jika minus
            balanceEl.style.color = totalBalance < 0 ? 'var(--expense)' : 'var(--text-main)';
        }, (error) => {
            console.error("Error fetching real-time data: ", error);
            showToast('Koneksi terputus atau izin ditolak!', 'error');
            document.getElementById('connectionStatus').innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Offline';
            document.getElementById('connectionStatus').style.color = 'var(--expense)';
        });

    </script>
</body>
</html>
